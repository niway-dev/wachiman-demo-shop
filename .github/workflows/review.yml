name: Wachiman review

# Why forks are excluded: the review runs on the operator's Claude subscription, through a repository
# secret. GitHub never gives secrets to a fork's pull request, and `pull_request_target` would hand them
# to code the fork controls, so this workflow uses `on: pull_request` only, and the job also requires
# that the branch lives in this repository.
#
# Why the gate is a fixed login and not `author_association`: this repository belongs to an
# organization whose members are private, and GitHub reports a private member as CONTRIBUTOR in event
# payloads, so an OWNER/MEMBER check skips the owner's own pull requests. The review runs on the Claude
# subscription of the operator through the repository secret CLAUDE_CODE_OAUTH_TOKEN (from
# `claude setup-token`), and only PRs that csdev19 opens from this repository's branches are reviewed.
# scripts/review-workflow.test.ts pins the gate.
#
# The `uses:` ref is an exact release tag, never a branch or the floating `v1`.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'csdev19'
    uses: niway-dev/wachiman/.github/workflows/review.yml@v1.19.0
    with:
      operator: csdev19
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
