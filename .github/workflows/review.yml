name: Wachiman review

# Why forks are excluded: GitHub gives no secrets to a fork's pull request, and `pull_request_target`
# is never used, because it would hand the secret to code a fork controls. So this workflow runs on
# `on: pull_request` only, and the job runs only when the branch lives in this repository.
#
# Every pull request from a branch of this repository is reviewed. Only people with write access can
# push branches here, so the gate does not need a login list.
#
# The review runs on the Claude subscription behind the repository secret CLAUDE_CODE_OAUTH_TOKEN
# (create the value with `claude setup-token`).
#
# `operator` is required by the reusable workflow. It only decides who may start a run by comment;
# the automatic review never checks it.
#
# The `uses:` ref is an exact release tag, never a branch or the floating `v1`.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: niway-dev/wachiman/.github/workflows/review.yml@v1.19.0
    with:
      operator: csdev19
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
